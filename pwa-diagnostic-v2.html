<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a2d59">
  <link rel="manifest" href="/manifest.webmanifest?v=05810">
  <title>Diagnostic PWA LTS v2</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#10233f;background:#f4f7fb}
    *{box-sizing:border-box} body{margin:0;padding:18px;line-height:1.4}.wrap{max-width:820px;margin:auto}
    h1{font-size:1.65rem;margin:0 0 6px}.sub{color:#5c6b7e;margin:0 0 18px}
    .card{background:#fff;border:1px solid #dce4ee;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 4px 18px rgba(16,35,63,.06)}
    .row{display:grid;grid-template-columns:minmax(150px,230px) 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #edf1f5}.row:last-child{border-bottom:0}
    .label{font-weight:700}.value{overflow-wrap:anywhere}.ok{color:#087a4b;font-weight:700}.warn{color:#a65b00;font-weight:700}.bad{color:#b3261e;font-weight:700}
    button{border:0;border-radius:12px;padding:12px 16px;background:#1264d8;color:white;font-weight:800;font-size:1rem;margin-right:8px;margin-top:6px}
    button.secondary{background:#e9f0fb;color:#174b91} pre{white-space:pre-wrap;word-break:break-word;background:#0f1724;color:#e7eef8;border-radius:12px;padding:12px;max-height:340px;overflow:auto}
    .summary{font-size:1.08rem;font-weight:800}.small{font-size:.9rem;color:#657487}
    @media(max-width:560px){.row{grid-template-columns:1fr}.label{margin-bottom:-4px}}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Diagnostic PWA LTS v2</h1>
  <p class="sub">Ce contrôle inspecte la vraie page d’accueil LTS, son manifeste, ses icônes et son service worker.</p>
  <div id="summary" class="card"><div class="summary">Analyse en cours…</div></div>
  <div id="root" class="card"><h2>Page d’accueil</h2></div>
  <div id="manifest" class="card"><h2>Manifeste de l’application</h2></div>
  <div id="sw" class="card"><h2>Service worker</h2></div>
  <div id="icons" class="card"><h2>Icônes</h2></div>
  <div class="card">
    <button id="rerun">Relancer le diagnostic</button>
    <button id="reload" class="secondary">Recharger la page</button>
    <p class="small">Cette page ne modifie ni Google Sheets ni les données LTS.</p>
  </div>
  <div class="card"><h2>Détails techniques</h2><pre id="raw">—</pre></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function row(label,value,status=''){return `<div class="row"><div class="label">${esc(label)}</div><div class="value ${status}">${esc(value)}</div></div>`}
function state(ok, warning=false){return ok?'ok':(warning?'warn':'bad')}

async function fetchInfo(url){
  try{
    const r=await fetch(url,{cache:'no-store'});
    const text=await r.text();
    return {
      ok:r.ok,
      status:r.status,
      type:r.headers.get('content-type')||'',
      cacheControl:r.headers.get('cache-control')||'',
      finalUrl:r.url,
      text
    };
  }catch(e){
    return {ok:false,status:'ERREUR',type:'',cacheControl:'',finalUrl:url,error:String(e),text:''};
  }
}

async function imageInfo(url){
  const fetched=await fetch(url,{cache:'no-store'})
    .then(r=>({ok:r.ok,status:r.status,type:r.headers.get('content-type')||''}))
    .catch(e=>({ok:false,status:'ERREUR',type:'',error:String(e)}));
  const loaded=await new Promise(resolve=>{
    const i=new Image();
    i.onload=()=>resolve({loaded:true,w:i.naturalWidth,h:i.naturalHeight});
    i.onerror=()=>resolve({loaded:false,w:0,h:0});
    i.src=url+(url.includes('?')?'&':'?')+'diag='+Date.now();
  });
  return {...fetched,...loaded};
}

async function run(){
  const raw={time:new Date().toISOString(),location:location.href,userAgent:navigator.userAgent};
  ['summary','root','manifest','sw','icons'].forEach(id=>{
    const titles={root:'Page d’accueil',manifest:'Manifeste de l’application',sw:'Service worker',icons:'Icônes'};
    if(id==='summary') $('#summary').innerHTML='<div class="summary">Analyse en cours…</div>';
    else $('#'+id).innerHTML='<h2>'+titles[id]+'</h2>';
  });

  const rootUrl=new URL('/',location.origin).href;
  const rootFetch=await fetchInfo(rootUrl+'?pwa_diag='+Date.now());
  raw.rootFetch={...rootFetch,text:rootFetch.text.slice(0,1000)};
  $('#root').innerHTML += row('URL contrôlée',rootUrl,'ok');
  $('#root').innerHTML += row('Réponse HTTP',String(rootFetch.status),state(rootFetch.ok));
  $('#root').innerHTML += row('Content-Type',rootFetch.type||'Absent',state(/text\/html/i.test(rootFetch.type),rootFetch.ok));

  let rootManifestHref=null;
  if(rootFetch.ok){
    const doc=new DOMParser().parseFromString(rootFetch.text,'text/html');
    const link=doc.querySelector('link[rel~="manifest"]');
    rootManifestHref=link?.getAttribute('href')||null;
    raw.rootManifestHref=rootManifestHref;
    $('#root').innerHTML += row('Balise manifest dans index.html',rootManifestHref||'Absente',state(!!rootManifestHref));
  }else{
    $('#root').innerHTML += row('Balise manifest dans index.html','Impossible à contrôler','bad');
  }

  let manifest=null, manifestUrl=null, manifestChecks=[];
  if(rootManifestHref){
    manifestUrl=new URL(rootManifestHref,rootUrl).href;
    const mf=await fetchInfo(manifestUrl);
    raw.manifestFetch={...mf,text:mf.text.slice(0,2000)};
    $('#manifest').innerHTML += row('URL',manifestUrl,'ok');
    $('#manifest').innerHTML += row('Réponse HTTP',String(mf.status),state(mf.ok));
    $('#manifest').innerHTML += row('Content-Type',mf.type||'Absent',state(/manifest\+json|application\/json/i.test(mf.type),mf.ok));
    if(mf.ok){
      try{
        manifest=JSON.parse(mf.text);
        raw.manifest=manifest;
        const checks={
          'name ou short_name':!!(manifest.name||manifest.short_name),
          'start_url':!!manifest.start_url,
          'display standalone/fullscreen':['standalone','fullscreen'].includes(manifest.display) ||
            (Array.isArray(manifest.display_override) && manifest.display_override.some(v=>['standalone','fullscreen'].includes(v))),
          'icône 192×192':Array.isArray(manifest.icons)&&manifest.icons.some(x=>(x.sizes||'').split(/\s+/).includes('192x192')),
          'icône 512×512':Array.isArray(manifest.icons)&&manifest.icons.some(x=>(x.sizes||'').split(/\s+/).includes('512x512')),
          'prefer_related_applications':manifest.prefer_related_applications!==true
        };
        for(const [k,v] of Object.entries(checks)){
          manifestChecks.push(v);
          $('#manifest').innerHTML += row(k,v?'Présent / valide':'Manquant / invalide',state(v));
        }
      }catch(e){
        raw.manifestParseError=String(e);
        $('#manifest').innerHTML += row('JSON','Invalide : '+e,'bad');
      }
    }
  }else{
    $('#manifest').innerHTML += row('Contrôle','Impossible : aucune balise manifest trouvée dans la vraie page d’accueil','bad');
  }

  let swOk=false;
  if('serviceWorker' in navigator){
    const regs=await navigator.serviceWorker.getRegistrations();
    raw.registrations=regs.map(r=>({
      scope:r.scope,
      active:r.active&&{state:r.active.state,scriptURL:r.active.scriptURL},
      waiting:r.waiting&&{state:r.waiting.state,scriptURL:r.waiting.scriptURL},
      installing:r.installing&&{state:r.installing.state,scriptURL:r.installing.scriptURL}
    }));
    $('#sw').innerHTML += row('API Service Worker','Disponible','ok');
    $('#sw').innerHTML += row('Enregistrements sur cette origine',String(regs.length),state(regs.length>0));
    const matching=regs.find(r=>r.scope===location.origin+'/')||regs[0];
    swOk=!!(matching&&matching.active&&matching.active.state==='activated');
    $('#sw').innerHTML += row('Worker actif',matching?.active ? `${matching.active.state} — ${matching.active.scriptURL}` : 'Absent',state(swOk));
    $('#sw').innerHTML += row('Page de diagnostic contrôlée',navigator.serviceWorker.controller ? 'Oui' : 'Non',state(!!navigator.serviceWorker.controller,true));
  }else{
    $('#sw').innerHTML += row('API Service Worker','Indisponible','bad');
  }

  let iconsOk=false;
  if(manifest&&Array.isArray(manifest.icons)){
    const results=[];
    for(const icon of manifest.icons){
      const u=new URL(icon.src,manifestUrl).href;
      const info=await imageInfo(u);
      results.push({icon,u,info});
      const dims=info.loaded?`${info.w}×${info.h}`:'non chargée';
      const ok=info.ok&&info.loaded&&/^image\//i.test(info.type);
      $('#icons').innerHTML += row(`${icon.sizes||'?'} · ${icon.purpose||'any'}`,`${info.status} · ${info.type||'sans type'} · ${dims} · ${u}`,state(ok));
    }
    raw.icons=results;
    iconsOk=results.some(x=>x.info.ok&&x.info.loaded&&x.info.w>=192&&x.info.h>=192) &&
            results.some(x=>x.info.ok&&x.info.loaded&&x.info.w>=512&&x.info.h>=512);
  }else{
    $('#icons').innerHTML += row('Contrôle','Impossible sans manifeste valide','bad');
  }

  const manifestOk=!!manifest&&manifestChecks.length>0&&manifestChecks.every(Boolean);
  const rootOk=!!rootManifestHref;
  let title,cls;
  if(!rootOk){title='La vraie page d’accueil ne déclare pas de manifeste.';cls='bad';}
  else if(!manifestOk){title='Le manifeste est présent, mais un critère requis est invalide.';cls='bad';}
  else if(!iconsOk){title='Le manifeste est valide, mais au moins une icône requise échoue.';cls='bad';}
  else if(!swOk){title='Le manifeste et les icônes sont valides, mais le service worker n’est pas actif.';cls='bad';}
  else{title='La base PWA est complète dans ce navigateur.';cls='ok';}
  $('#summary').innerHTML=`<div class="summary ${cls}">${esc(title)}</div>`;
  $('#raw').textContent=JSON.stringify(raw,null,2);
}

$('#rerun').addEventListener('click',run);
$('#reload').addEventListener('click',()=>location.reload());
run();
</script>
</body>
</html>

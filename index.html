function ensureWeekSessionStructureV0570(w,report=null){
 if(!w)return false;
 let changed=false;
 const note=(key)=>{if(report)report[key]=(report[key]||0)+1};

 if(!Array.isArray(w.sessions)){w.sessions=[];changed=true;note('arraysRepaired')}
 if(!Array.isArray(w.containers)){w.containers=[];changed=true;note('arraysRepaired')}

 const containerIds=new Set();
 w.containers.forEach((c,index)=>{
  if(!c.containerId){c.containerId=stableId('ctr');changed=true;note('containerIdsCreated')}
  containerIds.add(String(c.containerId));
  if(!SESSION_STRUCTURE_DAYS.includes(c.day)){c.day='Lun';changed=true;note('fieldsNormalized')}
  if(!SESSION_STRUCTURE_SLOTS.includes(c.slot)){c.slot='midi';changed=true;note('fieldsNormalized')}
  if(!c.title){c.title=`${slotLabel(c.slot)} — ${c.day}`;changed=true;note('fieldsNormalized')}
  if(!Number.isFinite(Number(c.sessionOrder))){c.sessionOrder=index+1;changed=true;note('ordersCreated')}
  c.structureType='SESSION_CONTAINER'
 });

 w.sessions.forEach((p,index)=>{
  if(!p.sessionId){p.sessionId=stableId('presc');changed=true;note('prescriptionIdsCreated')}

  let container=w.containers.find(c=>String(c.containerId)===String(p.containerId));
  if(!container){
   const day=SESSION_STRUCTURE_DAYS.includes(p.day)?p.day:'Lun';
   const slot=SESSION_STRUCTURE_SLOTS.includes(p.slot)?p.slot:((p.autoFlex||p.templateId==='flexibility')?'matin':(p.domain==='ESC'?'soir':'midi'));
   container=w.containers.find(c=>c.day===day&&c.slot===slot);
   if(!container){
    container={
     containerId:stableId('ctr'),
     day,
     slot,
     title:`${slotLabel(slot)} — ${day}`,
     comment:'',
     status:'PLANNED',
     sessionOrder:nextSessionOrder(w),
     structureType:'SESSION_CONTAINER'
    };
    w.containers.push(container);
    changed=true;
    note('containersCreated')
   }
   p.containerId=container.containerId;
   changed=true;
   note('linksRepaired')
  }

  if(p.day!==container.day){p.day=container.day;changed=true;note('fieldsNormalized')}
  if(p.slot!==container.slot){p.slot=container.slot;changed=true;note('fieldsNormalized')}
  if(!Number.isFinite(Number(p.prescriptionOrder))){
   p.prescriptionOrder=nextPrescriptionOrder(w,container.containerId);
   changed=true;
   note('ordersCreated')
  }
  p.structureType='PRESCRIPTION'
 });

 if(w.sessionStructureVersion!==SESSION_STRUCTURE_VERSION){
  w.sessionStructureVersion=SESSION_STRUCTURE_VERSION;
  changed=true
 }
 return changed
}

  if(!SESSION_STRUCTURE_SLOTS.includes(c.slot))errors.push(`${label} : créneau invalide`);
 });

 const containerById=new Map(containers.filter(c=>c.containerId).map(c=>[String(c.containerId),c]));
 const sessionOrderKeys=new Set();

 containers.forEach((c,index)=>{
  const label=c.title||`Séance ${index+1}`;
  const order=Number(c.sessionOrder);
  if(!Number.isFinite(order)||order<1)errors.push(`${label} : ordre de séance invalide`);
  else{
   const orderKey=`${c.day}|${c.slot}|${order}`;
   if(sessionOrderKeys.has(orderKey))errors.push(`${label} : ordre de séance dupliqué sur ce créneau`);
   else sessionOrderKeys.add(orderKey)
  }
 });

 const prescriptionOrderKeys=new Set();
 prescriptions.forEach((p,index)=>{
  const label=p.title||`Prescription ${index+1}`;
  if(!p.sessionId)errors.push(`${label} : identifiant de prescription manquant`);
  else if(prescriptionIds.has(String(p.sessionId)))errors.push(`${label} : identifiant de prescription dupliqué`);
  else prescriptionIds.add(String(p.sessionId));

  const container=p.containerId?containerById.get(String(p.containerId)):null;
  if(!container)errors.push(`${label} : séance de destination introuvable`);
  else{
   if(p.day!==container.day)errors.push(`${label} : jour différent de la séance parente`);
   if(p.slot!==container.slot)errors.push(`${label} : créneau différent de la séance parente`);
   const order=Number(p.prescriptionOrder);
   if(!Number.isFinite(order)||order<1)errors.push(`${label} : ordre de prescription invalide`);
   else{
    const orderKey=`${p.containerId}|${order}`;
    if(prescriptionOrderKeys.has(orderKey))errors.push(`${label} : ordre de prescription dupliqué dans la séance`);
    else prescriptionOrderKeys.add(orderKey)
   }
  }
 });

 containers.forEach(c=>{
  const count=prescriptions.filter(p=>String(p.containerId)===String(c.containerId)).length;
  if(count===0)errors.push(`${c.title||'Séance'} : aucune prescription`);
 });

 const executions=prescriptions.filter(p=>p.execution).length;
 return {
  valid:errors.length===0,
  errors,
  warnings,
  stats:{containers:containers.length,prescriptions:prescriptions.length,executions}
 }
}

function duplicateAuditValues(values){

 values.filter(Boolean).forEach(value=>{
  const key=String(value);

 return [...counts.entries()].filter(([,count])=>count>1).map(([value,count])=>({value,count}))
}

   const current=latest.get(number);
   if(!current||Number(w.publicationVersion||0)>Number(current.publicationVersion||0)){

   }
  });
 return [...latest.values()].sort((a,b)=>Number(a.number)-Number(b.number))
}

function collectV057ReleaseAudit(){
 const localWeeks=state.weeks||[];
 const remoteWeeks=latestRemoteWeeksForV057Audit();
 const errors=[];
 const warnings=[];
 const localChecks=localWeeks.map(w=>({week:w,check:validateWeekSessionStructureV0570(w)}));
 const remoteChecks=remoteWeeks.map(w=>({week:w,check:validateWeekSessionStructureV0570(w)}));

 localChecks.forEach(({week,check})=>{
  check.errors.forEach(issue=>errors.push(`Locale S${week.number} : ${issue}`))
 });
 remoteChecks.forEach(({week,check})=>{
  check.errors.forEach(issue=>errors.push(`Google Sheets S${week.number} : ${issue}`))
 });

 const duplicateWeekNumbers=duplicateAuditValues(localWeeks.map(w=>w.number));
 duplicateWeekNumbers.forEach(x=>errors.push(`Numéro de semaine locale dupliqué : S${x.value} (${x.count} occurrences)`));

 const duplicateWeekIds=duplicateAuditValues(localWeeks.map(w=>w.weekId));
 duplicateWeekIds.forEach(x=>errors.push(`Identifiant de semaine locale dupliqué : ${x.value}`));

 const localContainers=localWeeks.flatMap(w=>w.containers||[]);
 const localPrescriptions=localWeeks.flatMap(w=>w.sessions||[]);
 const duplicateContainerIds=duplicateAuditValues(localContainers.map(c=>c.containerId));
 duplicateContainerIds.forEach(x=>errors.push(`Identifiant de séance dupliqué entre plusieurs semaines : ${x.value}`));

 const duplicatePrescriptionIds=duplicateAuditValues(localPrescriptions.map(p=>p.sessionId));
 duplicatePrescriptionIds.forEach(x=>errors.push(`Identifiant de prescription dupliqué entre plusieurs semaines : ${x.value}`));

 const invalidPublishedVersions=localWeeks.filter(w=>w.status==='PUBLISHED'&&Number(w.publicationVersion||0)<1);
 invalidPublishedVersions.forEach(w=>errors.push(`S${w.number} publiée sans numéro de version valide`));

 const missingFingerprints=localWeeks.filter(w=>w.status==='PUBLISHED'&&!w.lastPublishedFingerprint);
 missingFingerprints.forEach(w=>warnings.push(`S${w.number} publiée sans empreinte locale enregistrée`));

 const unsyncedPlans=localWeeks.filter(w=>w.status==='PUBLISHED'&&w.planSync?.status!=='synced');
 const executed=localPrescriptions.filter(p=>p.execution);
 const unsyncedExecutions=executed.filter(p=>p.execution?.sync?.status!=='synced');

 if(unsyncedPlans.length)warnings.push(`${unsyncedPlans.length} semaine(s) publiée(s) ne sont pas marquées synchronisées`);
 if(unsyncedExecutions.length)warnings.push(`${unsyncedExecutions.length} résultat(s) ne sont pas marqués synchronisés`);
 if(!remoteWeeks.length)warnings.push('Aucune semaine publiée distante n’est actuellement chargée dans cette prévisualisation');

 const stats={
  localWeeks:localWeeks.length,
  remoteWeeks:remoteWeeks.length,
  containers:localContainers.length,
  prescriptions:localPrescriptions.length,
  executions:executed.length,
  unsyncedPlans:unsyncedPlans.length,
  unsyncedExecutions:unsyncedExecutions.length
 };
 const fullyReady=errors.length===0&&unsyncedPlans.length===0&&unsyncedExecutions.length===0;
 return {
  valid:errors.length===0,
  fullyReady,
  errors,
  warnings,
  stats,
  localChecks,
  remoteChecks,
  migration:state.sessionStructureMigration||null
 }
}

function executionTimestampV0575(execution){
 if(!execution)return 0;
 const candidates=[
  execution.sync?.updatedAt,
  execution.completedAt,
  execution.startedAt
 ];
 for(const value of candidates){
  const time=value?new Date(value).getTime():0;
  if(Number.isFinite(time)&&time>0)return time
 }
 return 0
}

function migrateAthleteExecutionCanonicalV0575(){
 const localSessions=new Map();
 (state.weeks||[]).forEach(w=>(w.sessions||[]).forEach(p=>{
  if(p.sessionId)localSessions.set(String(p.sessionId),p)
 }));

 let copied=0;
 (state.remoteWeeks||[]).forEach(w=>(w.sessions||[]).forEach(remotePrescription=>{
  if(!remotePrescription.sessionId||!remotePrescription.execution)return;
  const localPrescription=localSessions.get(String(remotePrescription.sessionId));
  if(!localPrescription)return;

  const localExecution=localPrescription.execution;
  const remoteExecution=remotePrescription.execution;
  const remoteIsUnsynced=remoteExecution.sync?.status!=='synced';
  const localIsUnsynced=localExecution&&localExecution.sync?.status!=='synced';
  const shouldCopy=!localExecution||(
   remoteIsUnsynced&&!localIsUnsynced
  )||(
   executionTimestampV0575(remoteExecution)>executionTimestampV0575(localExecution)
  );

  if(shouldCopy){
   localPrescription.execution=JSON.parse(JSON.stringify(remoteExecution));
   copied+=1
  }
 }));

 state.executionCanonicalMigration={
  version:'0.5.7.5',
  copied,
  migratedAt:new Date().toISOString()
 };
 return copied
}

 });

 return report

function ensureSessionContainers(){
 (state.weeks||[]).forEach(w=>{
   w.containers=w.containers||[];
   const slotOrder={matin:0,midi:1,soir:2};
   (w.sessions||[]).forEach(p=>{
     if(p.containerId&&w.containers.some(c=>c.containerId===p.containerId))return;
     const slot=p.slot||((p.autoFlex||p.templateId==='flexibility')?'matin':(p.domain==='ESC'?'soir':'midi'));
     let c=w.containers.find(x=>x.day===p.day&&x.slot===slot);
     if(!c){
       c={containerId:newContainerId(),day:p.day,slot,title:`${slotLabel(slot)} — ${p.day}`,comment:'',status:'PLANNED'};
       w.containers.push(c)
     }
     p.containerId=c.containerId;p.slot=slot
   });
   const dayOrder={Lun:0,Mar:1,Mer:2,Jeu:3,Ven:4,Sam:5,Dim:6};
   w.containers.sort((a,b)=>{const d=(dayOrder[a.day]??99)-(dayOrder[b.day]??99);return d||((slotOrder[a.slot]??1)-(slotOrder[b.slot]??1))})
 })
}
const SESSION_DAY_ORDER={Lun:0,Mar:1,Mer:2,Jeu:3,Ven:4,Sam:5,Dim:6};
const SESSION_SLOT_ORDER={matin:0,midi:1,soir:2};

function orderedSessionContainers(w){
 return [...(w?.containers||[])].sort((a,b)=>{
  const day=(SESSION_DAY_ORDER[a.day]??99)-(SESSION_DAY_ORDER[b.day]??99);
  if(day)return day;

  const slot=(SESSION_SLOT_ORDER[a.slot]??99)-(SESSION_SLOT_ORDER[b.slot]??99);
  if(slot)return slot;

  const order=(Number(a.sessionOrder)||0)-(Number(b.sessionOrder)||0);
  if(order)return order;

  return String(a.containerId||'').localeCompare(String(b.containerId||''))
 })
}

function orderedContainerPrescriptions(w,c){
 return (w?.sessions||[])
  .filter(p=>String(p.containerId)===String(c.containerId))
  .sort((a,b)=>{
   const order=(Number(a.prescriptionOrder)||0)-(Number(b.prescriptionOrder)||0);
   if(order)return order;
   return String(a.sessionId||'').localeCompare(String(b.sessionId||''))
  })
}

function containerPrescriptions(w,c){return (w.sessions||[]).filter(p=>p.containerId===c.containerId)}
function containerDuration(w,c){return containerPrescriptions(w,c).reduce((sum,p)=>sum+(+p.duration||0),0)}
function containerStatus(w,c){
 const ps=containerPrescriptions(w,c),done=ps.filter(p=>p.execution?.completed).length;
 if(!ps.length||done===0)return 'À faire';
 if(done===ps.length)return 'Terminée';
 return 'En cours'
}

 state.schemaVersion=LTS_SCHEMA_VERSION;

}

function splitDurationSeconds(value){
 const total=Math.max(0,Math.round(Number(value)||0));
 return {minutes:Math.floor(total/60),seconds:total%60}
}
function combineDurationSeconds(minutes,seconds){
 const m=Math.max(0,Math.floor(Number(minutes)||0));
 const s=Math.max(0,Math.min(59,Math.floor(Number(seconds)||0)));
 return m*60+s
}
function formatDurationSeconds(value){
 const total=Math.max(0,Math.round(Number(value)||0));
 if(!total)return '0 s';
 const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
 if(h)return `${h} h ${String(m).padStart(2,'0')}${s?` ${String(s).padStart(2,'0')} s`:''}`;
 if(m)return `${m} min${s?` ${String(s).padStart(2,'0')} s`:''}`;
 return `${s} s`
}
function formatDurationMinutes(value){
 const minutes=Number(value);
 if(!Number.isFinite(minutes)||minutes<0)return '—';
 const total=Math.round(minutes*60);
 if(total<60)return formatDurationSeconds(total);
 const h=Math.floor(total/3600),m=Math.floor((total%3600)/60),s=total%60;
 if(h)return `${h} h ${String(m).padStart(2,'0')}${s?` ${String(s).padStart(2,'0')} s`:''}`;
 return `${m} min${s?` ${String(s).padStart(2,'0')} s`:''}`
}

function previousComparableSetSession(current){

 const rows=[],seen=new Set();

 const currentDate=String(current?.sessionDate||'').slice(0,10)||'9999-12-31';
 sources.forEach(week=>(week.sessions||[]).forEach(session=>{
  if(String(session?.templateId||'')!==String(current.templateId||''))return;

  rows.push({week,session,date})

const FLASH_FONT_GRADES=['4a','4a+','4b','4b+','4c','4c+','5a','5a+','5b','5b+','5c','5c+','6a','6a+','6b','6b+','6c','6c+','7a','7a+','7b','7b+','7c','7c+','8a','8a+','8b','8b+','8c','8c+','9a'];
const FLASH_COLOR_GRADES=['blanc','jaune','orange','vert','bleu','rouge','noir','rose','violet'];
function flashEscape(value){return String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[char]))}
function flashDateLabel(value){
 const raw=String(value||'').slice(0,10);
 const match=raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
 return match?`${match[3]}/${match[2]}/${match[1]}`:(raw||'Date inconnue')
}
function flashGradeInfo(value){
 const compact=String(value||'').trim().toLowerCase().replace(/\s+/g,'');
 if(!compact)return null;
 const fontMatches=compact.match(/[4-9][abc]\+?/g)||[];
 const font=fontMatches.length?fontMatches[fontMatches.length-1]:'';
 const fontIndex=FLASH_FONT_GRADES.indexOf(font);
 if(fontIndex>=0)return {system:'FONT',score:fontIndex,label:font.replace(/[abc]/,letter=>letter.toUpperCase())};
 const normalized=compact.normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const colorMatch=normalized.match(/^(blanc|jaune|orange|vert|bleu|rouge|noir|rose|violet)([+-])?$/);
 if(!colorMatch)return null;
 const base=colorMatch[1],modifier=colorMatch[2]||'',baseIndex=FLASH_COLOR_GRADES.indexOf(base);
 return {
  system:'COLOR',
  score:baseIndex*3+(modifier==='+'?1:modifier==='-'?-1:0),
  label:base.charAt(0).toUpperCase()+base.slice(1)+modifier
 }
}
function isKilterFlashSession(session){
 const template=String(session?.templateId||'').toLowerCase();
 const mode=String(session?.climbing?.mode||session?.climbingMode||'').toUpperCase();
 const problems=session?.execution?.problems||[];
 const attemptContext=problems.map(problem=>[problem?.externalId,problem?.support].filter(Boolean).join(' ')).join(' ').toLowerCase();
 const hasRecordedBoardAngle=problems.some(problem=>normalizeKilterAngle(problem?.wallAngleDeg??problem?.angle)!==null)
   ||normalizeKilterAngle(session?.execution?.angle)!==null;
 const context=[session?.title,session?.notes,session?.coachComment,session?.climbing?.technicalFocus,attemptContext].filter(Boolean).join(' ').toLowerCase();
 return template.startsWith('kilter')||mode.startsWith('KILTER')||context.includes('kilter')||hasRecordedBoardAngle
}
function climbingFlashSessionEntries(){
 const bySession=new Map();
 const sources=[...(state.remoteWeeks||[]),...(state.weeks||[])];
 sources.forEach(week=>{
  (week.sessions||[]).forEach(session=>{
   if(session?.execution?.type!=='CLIMBING')return;
   const key=String(session.sessionId||`${week.number}-${session.title}`);
   const previous=bySession.get(key);
   if(!previous||(!previous.session.execution?.completed&&session.execution?.completed)){
    bySession.set(key,{week,session})
   }else if(previous&&session.execution){
    bySession.set(key,{week,session})
   }
  })
 });
 return [...bySession.values()]
}
function normalizeKilterAngle(value){
 const match=String(value??'').replace(',', '.').match(/(?:^|\D)(20|30|40)(?:\D|$)/);
 return match?Number(match[1]):null
}
function topFlashData(kind,limit=5,angleFilter=null){
 const records=[];
 climbingFlashSessionEntries().forEach(({week,session})=>{
  const kilter=isKilterFlashSession(session);
  if((kind==='kilter')!==kilter)return;
  const sessionAngle=kilter?normalizeKilterAngle(session?.climbing?.angle??session?.execution?.angle):null;
  const container=(week.containers||[]).find(item=>String(item.containerId)===String(session.containerId));
  const plannedDate=container?containerCalendarDate(week,container):'';
  const date=String(session.execution?.completedAt||plannedDate||'').slice(0,10);
  (session.execution?.problems||[]).forEach((problem,index)=>{
   if(problem?.flash!==true)return;
   const grade=flashGradeInfo(problem.grade);
   if(!grade)return;
   const problemAngle=kilter
     ?normalizeKilterAngle(problem?.wallAngleDeg??problem?.angle??sessionAngle)
     :null;
   if(kind==='kilter'&&angleFilter!==null&&problemAngle!==Number(angleFilter))return;
   records.push({
    grade,
    name:problem.name||`Bloc ${index+1}`,
    sessionTitle:session.title||'Escalade',
    date,
    angle:problemAngle,
    completedAt:session.execution?.completedAt||date||''
   })
  })
 });
 const counts=records.reduce((acc,item)=>{acc[item.grade.system]=(acc[item.grade.system]||0)+1;return acc},{});
 const preferred=kind==='kilter'?'FONT':((counts.COLOR||0)>=(counts.FONT||0)?'COLOR':'FONT');
 const eligible=records.filter(item=>item.grade.system===preferred);
 const ranked=eligible
  .sort((a,b)=>b.grade.score-a.grade.score||String(b.completedAt).localeCompare(String(a.completedAt))||a.name.localeCompare(b.name,'fr'))
  .slice(0,limit);
 return {records:ranked,system:preferred,total:records.length,excluded:records.length-eligible.length}
}
function topFlashCard(kind,angleFilter=null){
 const data=topFlashData(kind,5,angleFilter);
 const isKilter=kind==='kilter';
 const title=isKilter?`Top 5 flash — Kilterboard ${angleFilter}°`:'Top 5 flash — Salle';
 const systemLabel=data.system==='FONT'?'Cotation Fontainebleau':'Cotation par couleurs';
 if(!data.records.length){
  return `<div class="card flashboard"><div class="flashboardhead"><div><h3>${title}</h3><div class="muted small">Historique complet</div></div><span class="pill">0</span></div><p class="muted">Aucun bloc flashé avec une cotation classable.</p></div>`
 }
 const rows=data.records.map((item,index)=>{
  const metadata=flashDateLabel(item.date);
  const detail=item.name===item.sessionTitle?item.name:`${item.name} · ${item.sessionTitle}`;
  return `<div class="flashrecord"><div class="flashrank">${index+1}</div><div><div class="flashgrade">${flashEscape(item.grade.label)}</div><div class="flashname" title="${flashEscape(detail)}">${flashEscape(detail)}</div></div><div class="flashmeta">${flashEscape(metadata)}</div></div>`
 }).join('');
 const excluded=data.excluded?` · ${data.excluded} cotation(s) d’un autre système non mélangée(s) au classement`:'';
 return `<div class="card flashboard"><div class="flashboardhead"><div><h3>${title}</h3><div class="muted small">Historique complet · ${systemLabel}</div></div><span class="pill green">${data.records.length}</span></div><div class="flashlist">${rows}</div><div class="flashfooter">Les égalités sont départagées par la performance la plus récente${excluded}.</div></div>`
}

function save(){
 const serialized=JSON.stringify(state);

 try{
  localStorage.setItem(KEY,serialized)
 }catch(error){
  const quotaError=error?.name==='QuotaExceededError'||error?.code===22||error?.code===1014;
  if(!quotaError)throw error;

  // Nettoyage ciblé : uniquement les anciennes copies complètes de LTS.
  cleanupLegacyLtsStateKeys();

  try{
   localStorage.setItem(KEY,serialized)
  }catch(retryError){
   console.error('Stockage local toujours insuffisant',retryError);
   toast('Stockage local insuffisant. Synchronise puis recharge la PWA.');
   throw retryError
  }
 }

 // La synchronisation automatique ne doit jamais bloquer l’enregistrement
 // ni empêcher la fermeture d’une fenêtre.
 if(!window.__LTS_SUPPRESS_LOCAL_CHANGE__){
  const changedAt=new Date().toISOString();
  setTimeout(()=>{
   try{
    window.dispatchEvent(new CustomEvent('lts-local-change',{detail:{at:changedAt}}))
   }catch(error){
    console.error('Notification de modification locale',error)
   }
  },0)
 }
}

function allExecutedSessions(){
 return (state.weeks||[]).filter(w=>!w.isDemo).flatMap(w=>(w.sessions||[]).filter(s=>s.execution).map(s=>({week:w.number,...s})))
   .sort((a,b)=>(b.execution?.completedAt||'').localeCompare(a.execution?.completedAt||''));
}
function plannedActualSummary(s){
 const e=s.execution||{};
 if(e.type==='SETS'){
   const planned=(s.structuredSets||[]).reduce((sum,x)=>sum+(Number(x.reps)||0),0);
   const actual=(e.sets||[]).reduce((sum,x)=>sum+(Number(x.reps)||0),0);
   return `Répétitions : ${planned||'—'} prévues / ${actual||'—'} réalisées`;
 }
 if(e.type==='RUN'){
   return `${e.distance||'—'} km · ${e.duration||'—'} min · ${e.speed||'—'} km/h · ${e.pace||'—'}`;
 }
 if(e.type==='CLIMBING'){
   const probs=e.problems||[],success=probs.filter(x=>x.success).length,flashes=probs.filter(x=>x.flash).length;
   return `${probs.length} blocs renseignés · ${success} réussis · ${flashes} flash`;
 }
 if(e.type==='EXERCISES'){
   return `${(e.exercises||[]).length} exercice(s) renseigné(s)`;
 }
 return `${e.duration||s.duration||'—'} min réalisés`;
}

}

};

 maxhang:['B'],repeaters:['B'],
 pullstrength:['A_PULL'],pullend:['A_PULL'],pullpower:['A_PULL'],

 climbfun:['ESC'],climbtech:['ESC','C'],climbmax:['ESC','BM'],kiltertech:['ESC','C'],kiltervolume:['ESC'],kilterintense:['ESC','BM','B'],
 lowerstrength:['LOWER','LOWER_MAX'],lowerpower:['LOWER','LOWER_POWER']

function upperBodyDomainsForSession(s){
 const text=[s?.templateId,s?.title,s?.guide,...(s?.remoteExerciseCatalogIds||[])].join(' ').toLowerCase();
 const domains=[];
 if(/pull|traction|tirage|ex_pull/.test(text))domains.push('A_PULL');
 if(/dip|push|poussée|poussee|ex_dip/.test(text))domains.push('A_PUSH');
 return domains
}
function remoteStimulusDomains(s){
 const target=s?.stimulusTarget||{};
 const code=String(target.stimulus_code||'').trim().toUpperCase();
 const quality=String(target.quality_id||'').trim().toLowerCase();
 const template=String(s?.templateId||'').trim().toLowerCase();
 const domains=[
   ...(REMOTE_STIMULUS_DOMAIN_MAP[code]||REMOTE_QUALITY_DOMAIN_MAP[quality]||[]),
   ...(TEMPLATE_DOMAIN_MAP[template]||[])
 ];
 if(/^UPPER_(MAX|END|POWER)$/.test(code)||quality.startsWith('q_upper_')||template.startsWith('pull')||template.startsWith('dip')){
   domains.push(...upperBodyDomainsForSession(s))
 }
 return [...new Set(domains.filter(Boolean))]
}
function sessionStimuli(s){
 if(Array.isArray(s?.stimuli))return [...new Set(s.stimuli.filter(Boolean))];
 return [...new Set([s?.domain,...(s?.extraDomains||[]),...remoteStimulusDomains(s)].filter(Boolean))]
}
function weekStimulusUnits(w){
 if(!w)return [];
 const units=new Map();
 (w.containers||[]).forEach((c,index)=>{
   const key=String(c.containerId||`container-${index}`);
   units.set(key,{...c,containerId:key,prescriptions:[]})
 });
 (w.sessions||[]).forEach((p,index)=>{
   const key=String(p.containerId||`orphan-${p.sessionId||index}`);
   if(!units.has(key))units.set(key,{
     containerId:key,day:p.day,slot:p.slot,title:p.title||'Séance',sessionOrder:index+1,prescriptions:[]
   });
   units.get(key).prescriptions.push(p)
 });
 return [...units.values()].filter(unit=>unit.prescriptions.length).map(unit=>({
   ...unit,
   stimuli:[...new Set(unit.prescriptions.flatMap(sessionStimuli).filter(Boolean))],
   autoFlex:unit.prescriptions.every(p=>Boolean(p.autoFlex))
 }))
}
function weekCount(domain,n){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));if(!w)return 0;
 return weekStimulusUnits(w).filter(unit=>{
   if(!sessionStimuli(unit).includes(domain))return false;
   if(domain==='SOUP')return true;
   return !unit.autoFlex
 }).length
}
function requirementCard(r,n){
 const count=weekCount(r.domain,n), pct=Math.min(100,Math.round(count/r.target*100));
 return `<div class="reqcard ${count>=r.min?'ok':'missing'}"><div class="reqtop"><div><b>${r.name}</b><div class="muted small">${r.role}</div></div><span class="pill ${count>=r.min?'green':'orange'}">${count}/${r.target}</span></div><div class="small" style="margin-top:7px">Cible : ${r.min===r.target?r.target:r.min+' à '+r.target} ${r.unit}</div><div class="reqbar"><i style="width:${pct}%"></i></div><div class="guide">${r.guide}</div></div>`
}

function weekExecutionSummary(w){
 const sessions=(w.sessions||[]).filter(s=>!s.autoFlex);

const DAY_INDEX={Lun:0,Mar:1,Mer:2,Jeu:3,Ven:4,Sam:5,Dim:6};

function sessionDurationMinutes(s){
 if(Array.isArray(s?.prescriptions))return s.prescriptions.reduce((sum,p)=>sum+(Number(p?.duration)||0),0);

}
function sessionIntensityClass(s){
 if(Array.isArray(s?.prescriptions)){
   const levels=s.prescriptions.map(sessionIntensityClass);
   let level=levels.includes('HIGH')?'HIGH':levels.includes('MODERATE')?'MODERATE':'LOW';
   const stimuli=sessionStimuli(s),duration=sessionDurationMinutes(s);
   // Une longue séance libre reste une charge modérée, même si son objectif est ludique.
   if(level==='LOW'&&stimuli.includes('ESC')&&duration>=120)level='MODERATE';
   return level
 }
 const id=String(s?.templateId||'').toLowerCase();
 const title=String(s?.title||'').toLowerCase();
 const code=String(s?.stimulusTarget?.stimulus_code||'').toUpperCase();
 const duration=sessionDurationMinutes(s);
 if(['FINGER_MAX','BLOC_MAX','UPPER_MAX','RUN_THRESHOLD','RUN_INTERVAL','RUN_TEST','LOWER_POWER'].includes(code))return 'HIGH';
 if(['CLIMB_TECHNIQUE','CLIMB_COORDINATION','RUN_EASY','FLEXIBILITY','MOBILITY','PREVENTION'].includes(code))return 'LOW';
 if(['CLIMB_VOLUME','CORE','UPPER_END','LOWER_MAX','LOWER_END'].includes(code))return 'MODERATE';
 if(['maxhang','climbmax','kilterintense','pullstrength','dipstrength','repeaters','lowerpower'].includes(id))return 'HIGH';
 if(title.includes('maximal')||title.includes('force')||title.includes('fractionné')||title.includes('seuil'))return 'HIGH';
 if(id==='climbfun')return duration>=120?'MODERATE':'LOW';
 if(['flexibility','flexjessica20','flexjessica38'].includes(id)||s?.autoFlex)return 'LOW';

}
function recoveryStimuli(s){

function sharedRecoveryStimuli(a,b){

   if(levels.includes('HIGH')&&(levels.includes('HIGH')||levels.includes('MODERATE')))return 48;

 if(shared.includes('ESC')){
   if(ia==='LOW'&&ib==='LOW')return 0;

   if(ia==='HIGH'&&ib==='HIGH')return 48;
   if(levels.includes('HIGH'))return 24;

function sessionAbsoluteHour(s){

function g21Bounds(){return {ESC:[3,4],BM:[1,2],A_PULL:[1,4],A_PUSH:[1,4],B:[1,4],D:[2,4],C:[1,3],CALI:[1,3],SOUP:[7,14],MOB:[1,3],PREV:[1,3]}}
function evaluateG21Week(w){
 const alerts=[],sessions=weekStimulusUnits(w),bounds=g21Bounds();
 Object.entries(bounds).forEach(([stim,[min,max]])=>{
  const n=countStimulus(w,stim);
  if(n<min){
   const severity=['ESC','D','B'].includes(stim)&&n===0?'critical':'warning';
   alerts.push({severity,rule:`G21 · ${stim} minimum`,reason:`${n} stimulus planifié pour une cible de ${min} à ${max}.`,action:`Ajouter ${min-n} stimulus ${stim} ou documenter une adaptation volontaire.`})
  } else if(n>max) alerts.push({severity:'warning',rule:`G21 · ${stim} maximum`,reason:`${n} stimuli planifiés pour une limite de ${max}.`,action:`Retirer, fusionner ou alléger ${n-max} stimulus.`})
 });
 const ordered=sessions.filter(s=>DAY_INDEX[s.day]!==undefined&&!s.autoFlex).sort((a,b)=>sessionAbsoluteHour(a)-sessionAbsoluteHour(b));
 const previousByStimulus=new Map();
 ordered.forEach(current=>{
  const previousUnits=new Map();
  recoveryStimuli(current).forEach(stim=>{
    const previous=previousByStimulus.get(stim);
    if(previous)previousUnits.set(previous.containerId||`${previous.day}-${previous.slot}-${previous.title}`,previous)
  });
  previousUnits.forEach(previous=>{
    const req=minRecoveryHours(previous,current);
    const gap=sessionAbsoluteHour(current)-sessionAbsoluteHour(previous);
    if(req&&gap<req)alerts.push({
      severity:sessionIntensityClass(previous)==='HIGH'&&sessionIntensityClass(current)==='HIGH'?'critical':'warning',

  });

 });
 const byDay={};sessions.filter(s=>!s.autoFlex).forEach(s=>(byDay[s.day]||(byDay[s.day]=[])).push(s));
 Object.entries(byDay).forEach(([day,list])=>{
  const high=list.filter(s=>sessionIntensityClass(s)==='HIGH');
  const onlyComplementaryUpper=high.length===2&&high.some(s=>sessionStimuli(s).includes('A_PULL'))&&high.some(s=>sessionStimuli(s).includes('A_PUSH'));
  if(high.length>=2&&!onlyComplementaryUpper)alerts.push({severity:'warning',rule:'G21 · interférence intra-journée',reason:`${high.length} contenus à forte intensité sont prévus le ${day}.`,action:'Conserver une seule priorité haute, regrouper les contenus compatibles dans une même séance ou séparer les séances.'});
  if(list.some(s=>sessionStimuli(s).includes('B'))&&list.some(s=>sessionStimuli(s).includes('BM')||s.templateId==='kilterintense'))
   alerts.push({severity:'critical',rule:'G21 · surcharge locale doigts',reason:`Travail doigts et bloc maximal intense sont regroupés le ${day}.`,action:'Séparer ces contenus de 48 à 72 h.'})
 });
 const p=(state.cycle?.primary||'').toLowerCase(),s=(state.cycle?.secondary||'').toLowerCase();
 if(p.includes('doigt')&&countStimulus(w,'B')<2)alerts.push({severity:'critical',rule:'G21 · facteur limitant',reason:'Le cycle cible les doigts mais moins de 2 stimuli spécifiques sont planifiés.',action:'Ajouter une deuxième séance doigts.'});
 if(s.includes('running')&&countStimulus(w,'D')<2)alerts.push({severity:'warning',rule:'G21 · objectif secondaire',reason:'Le running secondaire n’atteint pas le minimum hebdomadaire.',action:'Ajouter une séance facile ou justifier la réduction.'});

 if(painful.length)alerts.push({severity:'critical',rule:'Sécurité · douleur',reason:`${painful.length} séance(s) récente(s) avec douleur ≥ 4/10.`,action:'Réévaluer les contenus avant publication.'});

function createDuplicatedWeek(){
 const sourceNumber=Number(document.getElementById('duplicateWeekSource')?.value);
 const destinationNumber=Number(document.getElementById('duplicateWeekDestination')?.value);
 const source=(state.weeks||[]).find(w=>Number(w.number)===sourceNumber);
 if(!source)return toast('Semaine source introuvable');
 if((state.weeks||[]).some(w=>Number(w.number)===destinationNumber))return toast('Cette semaine existe déjà');

 try{
  const duplicated=buildDuplicatedWeek(source,destinationNumber);
  const check=validateWeekSessionStructureV0570(duplicated);
  if(!check.valid)throw new Error(check.errors[0]||'Structure copiée invalide');

  state.weeks.push(duplicated);
  state.weeks.sort((a,b)=>Number(a.number)-Number(b.number));
  state.cycle.currentWeek=Math.max(Number(state.cycle.currentWeek||1),destinationNumber);
  ensureStableIds();
  logAudit(
   'DUPLICATE',
   'WEEK',
   duplicated.weekId,
   `S${sourceNumber} → S${destinationNumber} · ${check.stats.containers} séances · ${check.stats.prescriptions} prescriptions · 0 résultat`
  );
  save();
  closeAllSheets();
  openWeek(destinationNumber);
  toast(`Semaine ${destinationNumber} créée en brouillon`)
 }catch(error){
  console.error('Duplication semaine',error);
  toast('Duplication impossible : '+(error.message||'erreur inconnue'))
 }
}


function remoteWeekExists(number){
 return (state.remoteWeeks||[]).some(w=>Number(w.number)===Number(number))
}
function weekHasAnyExecution(week){
 return (week?.sessions||[]).some(session=>{
  if(session?.execution)return true;
  if(Array.isArray(session?.executions)&&session.executions.length)return true;
  return false
 })
}
function canDeleteLocalOnlyWeek(week){
 return !!week && !remoteWeekExists(week.number) && !weekHasAnyExecution(week)
}
function deleteLocalOnlyWeek(number){
 const week=(state.weeks||[]).find(w=>Number(w.number)===Number(number));
 if(!week)return toast('Semaine locale introuvable');
 if(remoteWeekExists(number))return toast('Suppression bloquée : cette semaine existe encore dans Google Sheets');
 if(weekHasAnyExecution(week))return toast('Suppression bloquée : cette semaine contient des résultats locaux');

 const ok=confirm(`Semaine ${number} existe uniquement dans la PWA et ne contient aucun résultat.\n\nLa supprimer localement ?\n\nGoogle Sheets ne sera pas modifié.`);
 if(!ok)return;

 state.weeks=(state.weeks||[]).filter(w=>Number(w.number)!==Number(number));
 if(Number(state.cycle?.currentWeek)===Number(number)){
  const remaining=(state.weeks||[]).map(w=>Number(w.number)).filter(Number.isFinite);
  state.cycle.currentWeek=remaining.length?Math.max(...remaining):1
 }
 logAudit('DELETE_LOCAL_ONLY','WEEK',week.weekId||`S${number}`,`Suppression locale S${number} · aucune écriture Google Sheets`);
 save();
 closeAllSheets();
 renderWeeks();
 toast(`Semaine ${number} supprimée localement`)
}
function localOnlyWeekRecoveryHtml(week){
 if(!week||remoteWeekExists(week.number))return '';
 if(weekHasAnyExecution(week)){
  return `<div class="protocolnote"><b>Semaine locale uniquement.</b> Elle n’existe plus dans Google Sheets mais contient des résultats locaux : suppression bloquée.</div>`
 }
 return `<div class="protocolnote">
  <b>Semaine locale uniquement.</b> Elle n’existe plus dans Google Sheets. Tu peux la supprimer de la PWA pour libérer son numéro, puis refaire une duplication propre.
  <div class="dataTools" style="margin-top:9px"><button class="btn danger" onclick="deleteLocalOnlyWeek(${week.number})">Supprimer cette semaine locale</button></div>
 </div>`
}

function normalizePrescriptionOrders(w,containerId){
 const rows=orderedContainerPrescriptions(w,{containerId});
 rows.forEach((p,index)=>p.prescriptionOrder=index+1)
}

function normalizeSessionOrdersForSlot(w,day,slot){
 const rows=(w.containers||[])
  .filter(c=>c.day===day&&c.slot===slot)
  .sort((a,b)=>(Number(a.sessionOrder)||0)-(Number(b.sessionOrder)||0));
 rows.forEach((c,index)=>c.sessionOrder=index+1)
}

function movePrescriptionOrder(n,sessionId,delta){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));
 const p=w?.sessions?.find(x=>String(x.sessionId)===String(sessionId));
 if(!w||!p)return toast('Prescription introuvable');

 const rows=orderedContainerPrescriptions(w,{containerId:p.containerId});
 const index=rows.findIndex(x=>String(x.sessionId)===String(sessionId));
 const target=index+Number(delta);
 if(index<0||target<0||target>=rows.length)return toast('La prescription est déjà en limite');

 [rows[index].prescriptionOrder,rows[target].prescriptionOrder]=[
  Number(rows[target].prescriptionOrder)||target+1,
  Number(rows[index].prescriptionOrder)||index+1
 ];
 normalizePrescriptionOrders(w,p.containerId);
 markWeekDraftAfterChange(w);
 save();
 closeAllSheets();
 openWeek(n);
 logAudit('REORDER','PRESCRIPTION',p.sessionId,`Ordre ${p.prescriptionOrder}`);
 toast('Ordre de la prescription modifié')
}

 const p=w?.sessions?.find(x=>String(x.sessionId)===String(sessionId));
 if(!w||!p)return toast('Prescription introuvable');

 const targets=orderedSessionContainers(w).filter(c=>String(c.containerId)!==String(p.containerId));
 document.body.insertAdjacentHTML('beforeend',`<div class="sheetwrap" id="movePrescriptionSheet"><div class="sheet">
  <div class="sheethead"><div><h2>Déplacer la prescription</h2><p class="muted">${p.title}</p></div>

  ${targets.length?targets.map(c=>`<button type="button" class="btn ghost moveTarget" onclick="movePrescriptionToContainer(${n},'${p.sessionId}','${c.containerId}')"><b>${c.day} · ${slotLabel(c.slot)}</b><br><span class="muted small">${c.title} · ${containerDuration(w,c)} min</span></button>`).join(''):'<p class="muted">Aucune autre séance disponible.</p>'}
 </div></div>`)
}

function movePrescriptionToContainer(n,sessionId,targetContainerId){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));
 const p=w?.sessions?.find(x=>String(x.sessionId)===String(sessionId));
 const target=w?.containers?.find(c=>String(c.containerId)===String(targetContainerId));
 if(!w||!p||!target)return toast('Destination introuvable');

 const previousContainerId=p.containerId;
 if(p.execution&&!confirm('Cette prescription possède déjà un résultat. La déplacer en conservant ce résultat ?'))return;

 p.containerId=target.containerId;
 p.day=target.day;
 p.slot=target.slot;
 p.prescriptionOrder=nextPrescriptionOrder(w,target.containerId);

 normalizePrescriptionOrders(w,previousContainerId);
 normalizePrescriptionOrders(w,target.containerId);
 markWeekDraftAfterChange(w);
 save();
 closeAllSheets();
 openWeek(n);
 logAudit('MOVE','PRESCRIPTION',p.sessionId,`${target.day} ${target.slot}`);
 toast('Prescription déplacée')
}

function duplicatePrescription(n,sessionId){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));
 const source=w?.sessions?.find(x=>String(x.sessionId)===String(sessionId));
 if(!w||!source)return toast('Prescription introuvable');

 const copy=safeClone(source);
 copy.sessionId=stableId('presc');
 copy.title=`${source.title} — copie`;
 copy.prescriptionOrder=nextPrescriptionOrder(w,source.containerId);
 copy.execution=null;
 copy.revision=0;
 copy.structureType='PRESCRIPTION';
 w.sessions.push(copy);

 markWeekDraftAfterChange(w);
 save();
 closeAllSheets();
 openWeek(n);
 logAudit('DUPLICATE','PRESCRIPTION',copy.sessionId,copy.title);
 toast('Prescription dupliquée sans résultat')
}

function removeWeekSessionById(n,sessionId){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));
 const p=w?.sessions?.find(x=>String(x.sessionId)===String(sessionId));
 if(!w||!p)return toast('Prescription introuvable');
 if(!confirm(`Retirer « ${p.title} » de la semaine ?`))return;

 const containerId=p.containerId;
 w.sessions=w.sessions.filter(x=>String(x.sessionId)!==String(sessionId));
 normalizePrescriptionOrders(w,containerId);

 if(containerId&&!w.sessions.some(x=>String(x.containerId)===String(containerId))){
  w.containers=w.containers.filter(c=>String(c.containerId)!==String(containerId))
 }

 markWeekDraftAfterChange(w);
 save();
 closeAllSheets();
 openWeek(n);
 logAudit('DELETE','PRESCRIPTION',p.sessionId,p.title);
 toast('Prescription retirée')
}

function moveSessionOrder(n,containerId,delta){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));
 const c=w?.containers?.find(x=>String(x.containerId)===String(containerId));
 if(!w||!c)return toast('Séance introuvable');

 const rows=(w.containers||[])
  .filter(x=>x.day===c.day&&x.slot===c.slot)
  .sort((a,b)=>(Number(a.sessionOrder)||0)-(Number(b.sessionOrder)||0));
 const index=rows.findIndex(x=>String(x.containerId)===String(containerId));
 const target=index+Number(delta);
 if(index<0||target<0||target>=rows.length)return toast('La séance est déjà en limite sur ce créneau');

 [rows[index].sessionOrder,rows[target].sessionOrder]=[
  Number(rows[target].sessionOrder)||target+1,
  Number(rows[index].sessionOrder)||index+1
 ];
 normalizeSessionOrdersForSlot(w,c.day,c.slot);
 markWeekDraftAfterChange(w);
 save();
 closeAllSheets();
 openWeek(n);
 logAudit('REORDER','SESSION_CONTAINER',c.containerId,`Ordre ${c.sessionOrder}`);
 toast('Ordre de la séance modifié')
}

function remoteExerciseMatchesGuide(row,guide){
 const text=refExerciseText(row);
 const family=String(row?.exercise_family||row?.family||'').toLowerCase();
 const movement=String(row?.movement_pattern||'').toLowerCase();
 const code=String(row?.exercise_code||'').toLowerCase();
 const primaryQuality=String(row?.primary_quality_id||'').toLowerCase();
 const catalogId=String(row?.exercise_catalog_id||row?.exercise_id||row?.id||'').toLowerCase();
 const active=String(row?.active??'true').trim().toLowerCase();
 if(row?.active===false||['false','0','no','non','inactive'].includes(active))return false;

 if(guide==='G04')return primaryQuality==='q_finger_power';
 if(guide==='G05')return primaryQuality==='q_upper_power'&&(movement.includes('pull')||text.includes('traction'));
 if(guide==='G06')return primaryQuality==='q_upper_power'&&(movement.includes('push')||text.includes('dip')||text.includes('pompe'));
 if(guide==='G10')return family==='core'||primaryQuality==='q_core';

 if(guide==='G11'){
  const flexibility=movement==='flexibility'||code.includes('flex')||catalogId.includes('flex')||text.includes('stretching')||text.includes('souplesse')||text.includes('jessica');
  return (family==='mobility'||primaryQuality==='q_mobility')&&!flexibility
 }
 if(guide==='G12-JESSICA-20')return catalogId==='ex_flex_jp20'||code.includes('jessica_prevalet_20');
 if(guide==='G12-JESSICA-38')return catalogId==='ex_flex_jp38'||code.includes('jessica_prevalet_full_body');
 if(guide==='G12'){
  return (family==='mobility'||primaryQuality==='q_mobility')&&(
   movement==='flexibility'||code.includes('flex')||catalogId.includes('flex')||
   text.includes('stretch')||text.includes('souplesse')||text.includes('jessica')
  )
 }
 if(guide==='G-CLIMB-ALL')return family==='climbing'||catalogId.includes('climb')||catalogId.includes('kilter')||code.includes('climb')||code.includes('kilter');
 if(['G13','G14','G15','G13-G15'].includes(guide)){
  const technicalQualities=['q_technique','q_hand_coord','q_foot_coord','q_full_coord'];
  const genericClimb=['climb_general','kilter_max'].some(value=>code.includes(value));
  return family==='climbing'&&technicalQualities.includes(primaryQuality)&&!genericClimb
 }
 if(guide==='G16')return primaryQuality==='q_cali_skill'||family==='skill';
 if(guide==='G23')return primaryQuality==='q_lower_max'&&family==='strength';
 if(guide==='G24')return primaryQuality==='q_lower_power'&&family==='power';
 if(guide==='G20-DOIGTS'){
  return family==='prevention' && (movement.startsWith('finger_')||code.includes('finger')||text.includes('finger '))
 }
 if(guide==='G20-POIGNETS'){
  return family==='prevention' && (
   movement.startsWith('wrist_')||text.includes('wrist ')||text.includes('pronation')||
   text.includes('supination')||text.includes('deviation radiale')||text.includes('deviation ulnaire')
  )
 }
 if(guide==='G20-COUDES'){
  return family==='prevention' && (
   text.includes('tyler')||text.includes('elbow')||text.includes('coude')||
   text.includes('eccentric')||text.includes('excentri')
  )
 }
 if(guide==='G20-EPAULES'){
  return family==='prevention' && (
   movement.startsWith('shoulder_')||movement.startsWith('scapular_')||
   text.includes('face pull')||text.includes('rotation externe')||text.includes('rotation interne')||
   text.includes('scapular')||text.includes('serratus')||text.includes('raise')
  )
 }
 if(guide==='G20-TRONC'){
  return family==='prevention' && (
   movement.startsWith('trunk_')||text.includes('bird dog')||text.includes('dead bug')||
   text.includes('side plank')||text.includes('core')
  )
 }
 if(guide==='G20-MI'){
  return family==='prevention' && (
   text.includes('calf')||text.includes('tibial')||text.includes('hamstring')||
   text.includes('copenhagen')||text.includes('single leg')||text.includes('hip ')||
   text.includes('glute')||text.includes('squat')||text.includes('plantar')
  )
 }
 return false
}

function exerciseOptionsForGuide(guide){
 const localGuides=guide==='G13-G15'?['G13','G14','G15']:guide==='G-CLIMB-ALL'?['G-CLIMB-ALL','G13','G14','G15']:[guide];
 const local=EXERCISE_LIBRARY.filter(x=>localGuides.includes(x.guide)).map(x=>({...x,source:x.source||'PWA'}));
 const refs=remoteReferenceExercises().filter(row=>remoteExerciseMatchesGuide(row,guide)).map(row=>normalizeRemoteExercise(row,guide));
 const technicalGuide=['G13','G14','G15','G13-G15'].includes(guide);
 if(technicalGuide&&refs.length){
  const localByName=new Map(local.map(x=>[normalizeExerciseName(x.name),x]));
  return refs.map(ref=>{
   const fallback=localByName.get(normalizeExerciseName(ref.name));
   return fallback?{...ref,...fallback,exerciseCatalogId:ref.exerciseCatalogId,exerciseCode:ref.exerciseCode||fallback.exerciseCode||'',source:'REF_EXERCISES'}:ref
  }).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'fr'))
 }
 const merged=new Map();

 local.forEach(x=>merged.set(normalizeExerciseName(x.name),x));
 refs.forEach(ref=>{
  const key=normalizeExerciseName(ref.name);
  const existing=merged.get(key);
  if(existing){
   merged.set(key,{
    ...ref,
    ...existing,
    exerciseCatalogId:ref.exerciseCatalogId||existing.exerciseCatalogId||'',
    exerciseCode:ref.exerciseCode||existing.exerciseCode||'',
    source:'REF_EXERCISES'
   })
  }else{
   merged.set(key,ref)
  }
 });

 return [...merged.values()].sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'fr'))
}

 return normalizeExerciseName(a?.name)===normalizeExerciseName(b?.name)
}

function collectStructuredSets(){
 return [...document.querySelectorAll('#setRows tr')].map(tr=>{const o={};tr.querySelectorAll('input').forEach(inp=>o[inp.dataset.k]=inp.value);return o})
}
function collectExercises(guide,p=null){
 const all=window.exerciseSelectorOptions?.[guide]||exerciseOptionsForGuide(guide),selected=[];
 const climbing=prescriptionUsesClimbing(p)||!!document.querySelector('[data-exfield="targetMode"]');
 document.querySelectorAll(`input[type=checkbox][data-guide="${guide}"]:checked`).forEach(cb=>{
  const i=+cb.dataset.ex,x=all[i],fields={};
  if(!x)return;
  document.querySelectorAll(`[data-exfield][data-index="${i}"]`).forEach(inp=>fields[inp.dataset.exfield]=inp.value);
  if(fields.load!==undefined&&String(fields.load).trim()!==''&&!String(fields.loadUnit||'').trim()){
   fields.loadUnit=x.loadUnit||'kg'
  }
  if(climbing){
   fields.targetMode=fields.targetMode==='COUNT'?'COUNT':'DURATION';
   fields.targetDurationMin=fields.targetMode==='DURATION'?(Number(fields.targetDurationMin)||null):null;
   fields.targetCount=fields.targetMode==='COUNT'?(Number(fields.targetCount)||null):null;
   fields.targetUnit=fields.targetUnit==='ATTEMPTS'?'ATTEMPTS':'BLOCKS';
   fields.restBetweenSeconds=Number(fields.restBetweenSeconds)||0;
   fields.athleteCanLogBlocks=fields.athleteCanLogBlocks==='true';
   fields.hold=fields.targetMode==='DURATION'&&fields.targetDurationMin?fields.targetDurationMin*60:'';
   fields.reps=fields.targetMode==='COUNT'&&fields.targetCount?fields.targetCount:'';
   fields.rest=fields.restBetweenSeconds;
  }
  selected.push({...x,...fields})
 });

 const customEnabled=document.getElementById('customExerciseEnabled')?.checked;
 const customName=String(document.getElementById('customExerciseName')?.value||'').trim();
 if(customEnabled&&customName){
  const customExercise={
   guide,
   name:customName,
   category:String(document.getElementById('customExerciseCategory')?.value||'Personnalisé').trim()||'Personnalisé',
   coachComment:document.getElementById('customExerciseCoachComment')?.value||'',
   custom:true,
   source:'CUSTOM'
  };
  if(climbing){
   customExercise.targetMode=document.getElementById('customClimbingTargetMode')?.value==='COUNT'?'COUNT':'DURATION';
   customExercise.targetDurationMin=customExercise.targetMode==='DURATION'?(Number(document.getElementById('customClimbingDuration')?.value)||null):null;
   customExercise.targetCount=customExercise.targetMode==='COUNT'?(Number(document.getElementById('customClimbingCount')?.value)||null):null;
   customExercise.targetUnit=document.getElementById('customClimbingUnit')?.value==='ATTEMPTS'?'ATTEMPTS':'BLOCKS';
   customExercise.restBetweenSeconds=Number(document.getElementById('customClimbingRest')?.value)||0;
   customExercise.athleteCanLogBlocks=document.getElementById('customClimbingAthleteLog')?.value==='true';
   customExercise.hold=customExercise.targetDurationMin?customExercise.targetDurationMin*60:'';
   customExercise.reps=customExercise.targetCount||'';
   customExercise.rest=customExercise.restBetweenSeconds
  }else{
   customExercise.sets=document.getElementById('customExerciseSets')?.value||'';
   customExercise.reps=document.getElementById('customExerciseReps')?.value||'';
   customExercise.load=document.getElementById('customExerciseLoad')?.value||'';
   customExercise.loadUnit=document.getElementById('customExerciseLoadUnit')?.value||'kg';
   customExercise.hold=document.getElementById('customExerciseHold')?.value||'';
   customExercise.rest=document.getElementById('customExerciseRest')?.value||''
  }
  selected.push(customExercise)
 }
 return selected
}
function invalidClimbingExercise(exercises=[]){
 return exercises.find(exercise=>exercise.targetMode==='COUNT'?!Number(exercise.targetCount):!Number(exercise.targetDurationMin))||null
}
function climbingSummaryFromExercises(exercises=[]){
 return {
  durationTargetMin:exercises.filter(x=>x.targetMode==='DURATION').reduce((sum,x)=>sum+(Number(x.targetDurationMin)||0),0)||null,
  problemCount:exercises.filter(x=>x.targetMode==='COUNT'&&x.targetUnit==='BLOCKS').reduce((sum,x)=>sum+(Number(x.targetCount)||0),0),
  attemptTarget:exercises.filter(x=>x.targetMode==='COUNT'&&x.targetUnit==='ATTEMPTS').reduce((sum,x)=>sum+(Number(x.targetCount)||0),0),
  athleteCanLogBlocks:exercises.some(x=>x.athleteCanLogBlocks===true)
 }
}
function savePrescription(n,id,containerId=state.pendingContainerId){

 const usesExercises=prescriptionUsesExerciseLibrary(p),usesClimbing=prescriptionUsesClimbing(p);

 let extra=[...(p.extraDomains||[])];

   problemCount:climbSummary.problemCount||0,
   attemptTarget:climbSummary.attemptTarget||0,

 const plannedDuration=+document.getElementById('prTotalDuration')?.value||45;
 const newSession={sessionId:'sess-'+Date.now()+'-'+Math.random().toString(16).slice(2),prescriptionOrder:nextPrescriptionOrder(w,ctr.containerId),structureType:'PRESCRIPTION',templateId:p.id,title:p.name,day:ctr.day,slot:ctr.slot,containerId:ctr.containerId,domain:p.domain,extraDomains:extra,guide:p.guide,duration:plannedDuration,structuredSets:structured,exercises:exercises,climbing:climbing,sets:+get('prSets')||null,reps:+get('prReps')||null,workSeconds:+get('prWork')||null,restSeconds:+get('prRest')||null,rir:get('prRir')!==null?+get('prRir'):null,rpe:get('prRpe')!==null?+get('prRpe'):null,load:get('prLoad'),notes:document.getElementById('prNotes')?.value||'',coachComment:document.getElementById('prCoachComment')?.value||'',execution:null};
 w.sessions.push(newSession);
 state.pendingContainerId=null;
 save();

 openWeek(n);
 logAudit('CREATE','PRESCRIPTION',newSession.sessionId,newSession.title);
 toast('Prescription ajoutée')
 }catch(error){

  toast('Erreur lors de l’ajout : '+(error.message||'inconnue'))
 }
}

function prescriptionExercisesForEdit(p,s){
 if(Array.isArray(s?.exercises)&&s.exercises.length)return s.exercises;
 if(!prescriptionUsesClimbing(p))return [];
 const catalog=exerciseOptionsForGuide(p.exerciseGuide);
 const preset=catalog.find(x=>(p.presetExerciseCatalogIds||[]).includes(x.exerciseCatalogId));
 if(!preset)return [];
 const old=s.climbing||{};
 const durationMode=old.prescriptionMode==='DURATION'||(!Number(old.problemCount)&&Number(old.durationTargetMin));
 return [{
  ...preset,
  targetMode:durationMode?'DURATION':'COUNT',
  targetDurationMin:durationMode?(Number(old.durationTargetMin)||Number(s.duration)||15):null,
  targetCount:durationMode?null:(Number(old.problemCount)||1),
  targetUnit:'BLOCKS',
  restBetweenSeconds:0,
  athleteCanLogBlocks:true,
  coachComment:old.technicalFocus||''
 }]
}

function saveEditedSessionById(n,sessionId){
 try{
  const w=state.weeks.find(x=>Number(x.number)===Number(n));
  const s=w?.sessions?.find(x=>String(x.sessionId)===String(sessionId));
  if(!w||!s)return toast('Prescription introuvable après synchronisation');
  const p=PRESCRIPTIONS.find(x=>x.id===s.templateId)||null;
  const usesExercises=prescriptionUsesExerciseLibrary(p);
  const usesClimbing=prescriptionUsesClimbing(p)||!!s.climbing;
  const editedExercises=usesExercises?collectExercises(p.exerciseGuide,p):null;
  if(usesExercises&&editedExercises.length===0)return toast('Conserve au moins un exercice de REF_EXERCISES');
  const invalidExercise=usesClimbing?invalidClimbingExercise(editedExercises||[]):null;
  if(invalidExercise)return toast(`Renseigne l’objectif de « ${invalidExercise.name} »`);

  s.title=document.getElementById('edTitle')?.value||s.title;
  const parentContainer=w.containers?.find(c=>String(c.containerId)===String(s.containerId));
  if(parentContainer){
    s.day=parentContainer.day;
    s.slot=parentContainer.slot
  }
  s.duration=+document.getElementById('edDuration')?.value||s.duration;
  s.notes=document.getElementById('edNotes')?.value||'';
  s.coachComment=document.getElementById('edCoachComment')?.value||'';

  if(document.getElementById('setRows'))s.structuredSets=collectStructuredSets();

  if(usesExercises){
    s.exercises=editedExercises
  }else if(s.exercises?.length){
    document.querySelectorAll('[data-edex]').forEach(inp=>{
      const j=+inp.dataset.edex,k=inp.dataset.k;
      if(s.exercises[j])s.exercises[j][k]=inp.value
    })
  }

  if(s.climbing){
    const summary=climbingSummaryFromExercises(editedExercises||s.exercises||[]);
    s.climbing.prescriptionMode='EXERCISES';
    s.climbing.durationTargetMin=summary.durationTargetMin||null;
    s.climbing.angle=document.getElementById('edClimbAngle')?.value||null;
    s.climbing.problemCount=summary.problemCount||0;
    s.climbing.attemptTarget=summary.attemptTarget||0;
    s.climbing.athleteCanLogBlocks=summary.athleteCanLogBlocks===true;
    s.climbing.attemptLimit=+document.getElementById('edClimbAttempts')?.value||0;
    s.climbing.targetGrade=document.getElementById('edClimbGrade')?.value||'';
    s.climbing.technicalFocus=document.getElementById('edClimbFocus')?.value||'';
    s.climbing.fingerStimulus=document.getElementById('edClimbFinger')?.value==='true';
    s.extraDomains=Array.isArray(s.extraDomains)?s.extraDomains:[];
    if(s.climbing.fingerStimulus&&!s.extraDomains.includes('B'))s.extraDomains.push('B');
    if(!s.climbing.fingerStimulus)s.extraDomains=s.extraDomains.filter(x=>x!=='B')
  }

  s.revision=(s.revision||0)+1;
  markWeekDraftAfterChange(w);
  save();

  closeAllSheets();
  openWeek(n);
  logAudit('UPDATE','PRESCRIPTION',s.sessionId,s.title);
  toast('Prescription modifiée')
 }catch(error){
  console.error('Enregistrement prescription',error);
  toast('Erreur lors de l’enregistrement : '+(error.message||'inconnue'))
 }
}

}

function weekPlanningFingerprint(w){
 const cleanContainers=(w.containers||[]).map(c=>({
  containerId:c.containerId,
  day:c.day,
  slot:c.slot,
  title:c.title||'',
  comment:c.comment||'',
  warmup:c.warmup||null
 })).sort((a,b)=>String(a.containerId).localeCompare(String(b.containerId)));

 const cleanPrescriptions=(w.sessions||[]).map(p=>({
  sessionId:p.sessionId,
  containerId:p.containerId,
  day:p.day,
  slot:p.slot,
  title:p.title||'',
  domain:p.domain||'',
  guide:p.guide||'',
  templateId:p.templateId||'',
  duration:p.duration??null,
  notes:p.notes||'',
  coachComment:p.coachComment||'',
  structuredSets:p.structuredSets||[],
  exercises:p.exercises||[],
  climbing:p.climbing||null,
  sets:p.sets??null,
  reps:p.reps??null,
  load:p.load??null,
  rir:p.rir??null,
  rpe:p.rpe??null,
  restSeconds:p.restSeconds??null,
  workSeconds:p.workSeconds??null
 })).sort((a,b)=>String(a.sessionId).localeCompare(String(b.sessionId)));

 return JSON.stringify({
  number:w.number,
  type:w.type,
  comment:w.comment||'',
  adaptationReason:w.adaptationReason||'',
  containers:cleanContainers,
  prescriptions:cleanPrescriptions
 })
}

function saveWeek(n,status){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));
 w.comment=document.getElementById('weekComment')?.value||'';
 w.status=status;
 if(status==='PUBLISHED'){
  const fingerprint=weekPlanningFingerprint(w);
  const changed=fingerprint!==w.lastPublishedFingerprint;
  if(!w.publicationVersion)w.publicationVersion=1;
  else if(changed)w.publicationVersion+=1;
  w.lastPublishedFingerprint=fingerprint;
  w.publishedAt=new Date().toISOString();
  w.publicationNotice=changed?'Nouvelle version publiée':'Version existante republiée';
 }
 logAudit(status==='PUBLISHED'?'PUBLISH':'SAVE_DRAFT','WEEK',w.weekId||String(n),`Statut ${status}`);
 save();
 closeSheet();
 renderWeeks();
 toast(status==='PUBLISHED'?'Semaine publiée localement':'Semaine enregistrée');

 // L’envoi distant démarre seulement après la mise à jour de l’interface.
 if(status==='PUBLISHED')setTimeout(()=>syncWeekPlan(n),0)
}
function attemptPublish(n){
 const w=state.weeks.find(x=>Number(x.number)===Number(n));if(!w)return;
 ensureWeekSessionStructureV0570(w);
 const structureCheck=validateWeekSessionStructureV0570(w);
 if(!structureCheck.valid){
  toast(`Structure invalide : ${structureCheck.errors[0]||'vérification requise'}`);
  return
 }
 w.comment=document.getElementById('weekComment')?.value||'';
 w.adaptedVoluntarily=document.getElementById('adaptedVoluntary')?.checked||false;
 w.adaptationReason=document.getElementById('adaptationReason')?.value||'';
 const g21=evaluateG21Week(w);
 if(g21.status==='INVALID'&&!w.adaptedVoluntarily)return toast('Semaine non valide : corrige les alertes ou documente une adaptation volontaire');
 if(w.adaptedVoluntarily&&!w.adaptationReason.trim())return toast('La justification de l’adaptation volontaire est obligatoire');
 const missing=GUIDE_REQUIREMENTS.filter(r=>weekCount(r.domain,n)<r.min);

function publishedWeeks(){

  .filter(w=>w.status==='PUBLISHED')
  .sort((a,b)=>Number(a.number)-Number(b.number));
 if(local.length)return local;

 const remote=(state.remoteWeeks||[]).filter(w=>w.status==='PUBLISHED');
 const latestByNumber=new Map();
 remote.forEach(w=>{
  const current=latestByNumber.get(Number(w.number));
  if(!current||Number(w.publicationVersion||0)>Number(current.publicationVersion||0)){
   latestByNumber.set(Number(w.number),w)

}

function localIsoDate(date=new Date()){

function containerCalendarDate(w,c){

 const start=w?.startDate||w?.start_date;
 if(start){
  const base=new Date(`${String(start).slice(0,10)}T12:00:00`);
  const offset=({Lun:0,Mar:1,Mer:2,Jeu:3,Ven:4,Sam:5,Dim:6})[c?.day];
  if(Number.isFinite(offset)){base.setDate(base.getDate()+offset);return localIsoDate(base)}

function athleteVisibleWeeks(){
 const weeks=publishedWeeks();
 if(!weeks.length)return [];
 const today=localIsoDate();
 const current=weeks.filter(w=>{
  const start=String(w.startDate||w.start_date||'').slice(0,10);
  const end=String(w.endDate||w.end_date||'').slice(0,10);
  return start&&end&&today>=start&&today<=end
 });
 if(current.length)return [current.sort((a,b)=>Number(b.publicationVersion||0)-Number(a.publicationVersion||0))[0]];
 const future=weeks.filter(w=>String(w.startDate||w.start_date||'').slice(0,10)>today)
  .sort((a,b)=>String(a.startDate||a.start_date).localeCompare(String(b.startDate||b.start_date)));
 if(future.length)return [future[0]];
 return [weeks[weeks.length-1]]
}

function formatPace(minutesPerKm){
 if(!Number.isFinite(minutesPerKm)||minutesPerKm<=0)return '—';
 const min=Math.floor(minutesPerKm);

 return `${min}:${String(sec===60?0:sec).padStart(2,'0')} min/km`;
}
function updateRunningCalculations(){
 const duration=+document.getElementById('runDuration')?.value||0;
 const distance=+document.getElementById('runDistance')?.value||0;
 const speed=duration>0&&distance>0?distance/(duration/60):0;
 const pace=distance>0&&duration>0?duration/distance:0;
 const speedEl=document.getElementById('runSpeedCalculated');
 const paceEl=document.getElementById('runPaceCalculated');
 if(speedEl)speedEl.textContent=speed?speed.toFixed(2)+' km/h':'—';
 if(paceEl)paceEl.textContent=pace?formatPace(pace):'—';
 return {speed,pace};
}

function saveClimbingExecution(sessionId){

function prescriptionAthleteStatus(p){
 if(p?.execution?.completed)return {label:'Terminée',className:'green'};

function containerProgress(w,c){
 const ps=orderedContainerPrescriptions(w,c);
 const done=ps.filter(p=>p.execution?.completed).length;
 const started=ps.filter(p=>p.execution&&!p.execution?.completed).length;
 const total=ps.length;
 const percent=total?Math.round(done/total*100):0;
 return {ps,done,started,total,percent,complete:total>0&&done===total}
}

function renderToday(){
 const dayMap=['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
 const today=dayMap[new Date().getDay()];
 const todayIso=localIsoDate();
 const weeks=publishedWeeks();
 const rows=[];
 weeks.forEach(w=>{
  orderedSessionContainers(w)
   .filter(c=>containerCalendarDate(w,c)===todayIso)
   .forEach(c=>rows.push({week:w,container:c}))
 });
 rows.sort((a,b)=>{
  const slot=(SESSION_SLOT_ORDER[a.container.slot]??99)-(SESSION_SLOT_ORDER[b.container.slot]??99);
  if(slot)return slot;
  const order=(Number(a.container.sessionOrder)||0)-(Number(b.container.sessionOrder)||0);
  if(order)return order;
  return Number(a.week.number)-Number(b.week.number)
 });
 const body=rows.length
  ? rows.map(x=>renderAthleteSessionCard(x.week,x.container,true)).join('')
  : '<div class="card"><p class="muted">Aucune séance publiée pour aujourd’hui.</p></div>';

}
